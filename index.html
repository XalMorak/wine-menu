<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140e0b">
<title>Wine Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --wood: #140e0b; --cream: #f3e6cf; --gold: #c4a46a; --ink: #2a2118; --muted: #7a6a58; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--wood); color: var(--cream); font-family: Manrope, sans-serif; overflow: hidden; }
  .book {
    height: 100dvh; width: 100%; display: flex; align-items: center; justify-content: center;
    background: #140e0b;
  }
  .spread {
    width: min(100vw, calc(100dvh * 16 / 9));
    height: min(100dvh, calc(100vw * 9 / 16));
    position: relative; perspective: 2000px;
  }
  .page { position: absolute; inset: 0; background: #1a120c; overflow: hidden; }
  .page img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; user-select: none; background: #140e0b; }
  .hit { position: absolute; border: 0; background: transparent; padding: 0; }
  .under { z-index: 1; }
  .leaf { z-index: 2; transform-origin: center top; will-change: transform; }
  .leaf.up { animation: flipUp .62s cubic-bezier(.22,.7,.25,1) forwards; }
  .leaf.down { animation: flipDown .62s cubic-bezier(.22,.7,.25,1) forwards; }
  .logo {
    position: absolute; top: 2.2%; right: 2.4%; width: 18%; height: auto; z-index: 5;
    pointer-events: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35));
  }
  .leaf.up .edge { animation: shade .62s linear forwards; }
  @keyframes flipUp {
    0% { transform: perspective(1400px) rotateX(0deg); }
    30% { transform: perspective(1400px) rotateX(-24deg); }
    100% { transform: perspective(1400px) rotateX(-90deg); }
  }
  @keyframes flipDown {
    0% { transform: perspective(1400px) rotateX(-90deg); }
    70% { transform: perspective(1400px) rotateX(-16deg); }
    100% { transform: perspective(1400px) rotateX(0deg); }
  }
  @keyframes shade { 40% { opacity: .2; } 100% { opacity: 1; } }
  .sheet {
    position: fixed; inset: 0; background: rgba(8,5,3,.62); display: none; align-items: flex-end; justify-content: center;
    z-index: 20; padding: 16px;
  }
  .sheet.on { display: flex; }
  .card {
    width: min(520px, 100%); background: linear-gradient(180deg, #f7eedd, #efe2cc);
    color: var(--ink); border-radius: 18px 18px 14px 14px; padding: 22px 22px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45); position: relative; animation: up .28s ease;
  }
  @keyframes up { from { transform: translateY(16px); opacity: .4; } to { transform: none; opacity: 1; } }
  .card h2 { font-family: "Cormorant Garamond", serif; font-size: 34px; line-height: 1; margin: 0 36px 6px 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .price { font-family: "Cormorant Garamond", serif; color: #8a6a32; font-size: 40px; margin: 10px 0 8px; }
  .card { max-height: min(86dvh, 760px); overflow: auto; }
  .facts { margin: 12px 0 4px; }
  .facts div { display: grid; grid-template-columns: 118px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid rgba(42,33,24,.1); }
  .facts b { font-weight: 600; font-size: 12px; letter-spacing: .02em; color: #6d5b45; }
  .facts span { font-size: 14px; line-height: 1.4; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { background: rgba(42,33,24,.08); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  .x {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: #1a120c; color: var(--cream); font-size: 18px; cursor: pointer;
  }
  .warn { font-size: 12px; color: #8d5a4a; margin-top: 12px; }
  @media (max-width: 720px) {
    .card h2 { font-size: 28px; }
    .price { font-size: 32px; }
  }
</style>
</head>
<body>
<div class="book" id="book"><div class="spread" id="spread"><img class="logo" src="img/logo.png" alt="Ерөө Говь ХХК"></div></div>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div>
<script src="wines.js?v=8"></script>
<script src="menu.js?v=8"></script>
</body>
</html>
