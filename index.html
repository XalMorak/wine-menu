<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a120c">
<title>Wine Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --wood: #140e0b;
    --cream: #f3e6cf;
    --gold: #c4a46a;
    --ink: #2a2118;
    --muted: #7a6a58;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--wood); color: var(--cream); font-family: Manrope, sans-serif; }
  body { min-height: 100dvh; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 6px; gap: 12px;
  }
  .brand { font-family: "Cormorant Garamond", serif; letter-spacing: .18em; font-size: 18px; font-weight: 600; }
  .tabs { display: flex; gap: 6px; }
  .tabs button, .pager button {
    border: 1px solid rgba(196,164,106,.45); background: transparent; color: var(--cream);
    border-radius: 999px; padding: 6px 12px; font: 600 12px/1 Manrope, sans-serif; letter-spacing: .04em;
  }
  .tabs button.on, .pager button.on { background: var(--gold); color: #1a120c; border-color: var(--gold); }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 10px 8px; }
  .stage {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  }
  .board { display: none; width: min(100%, calc((100dvh - 132px) * 16 / 9)); position: relative; }
  .board.on { display: block; }
  .board img { width: 100%; height: auto; display: block; border-radius: 6px; user-select: none; -webkit-user-drag: none; }
  .hit {
    position: absolute; border: 0; background: transparent; cursor: pointer; border-radius: 10px; padding: 0;
  }
  .hit:focus-visible, .hit:hover { outline: 2px solid rgba(196,164,106,.85); outline-offset: -3px; background: rgba(196,164,106,.12); }
  .pager { display: flex; justify-content: center; gap: 8px; padding: 8px 0 4px; }
  .hint { text-align: center; color: rgba(243,230,207,.55); font-size: 12px; padding-bottom: 8px; }
  .sheet {
    position: fixed; inset: 0; background: rgba(8,5,3,.62); display: none; align-items: flex-end; justify-content: center;
    z-index: 20; padding: 16px;
  }
  .sheet.on { display: flex; }
  .card {
    width: min(520px, 100%); background: linear-gradient(180deg, #f7eedd, #efe2cc);
    color: var(--ink); border-radius: 18px 18px 14px 14px; padding: 22px 22px 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45); position: relative;
    animation: up .28s ease;
  }
  @keyframes up { from { transform: translateY(16px); opacity: .4; } to { transform: none; opacity: 1; } }
  .card h2 { font-family: "Cormorant Garamond", serif; font-size: 34px; line-height: 1; margin: 0 36px 6px 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
  .price { font-family: "Cormorant Garamond", serif; color: #8a6a32; font-size: 40px; margin: 10px 0 8px; }
  .card p { margin: 8px 0; line-height: 1.45; font-size: 15px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .chip { background: rgba(42,33,24,.08); border-radius: 999px; padding: 6px 10px; font-size: 12px; }
  .x {
    position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: #1a120c; color: var(--cream); font-size: 18px; cursor: pointer;
  }
  .warn { font-size: 12px; color: #8d5a4a; margin-top: 12px; }
  @media (max-width: 720px) {
    .brand { display: none; }
    .card h2 { font-size: 28px; }
    .price { font-size: 32px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">WINE MENU</div>
  <div class="tabs">
    <button class="on" data-group="red">RED WINE</button>
    <button data-group="white">WHITE WINE</button>
  </div>
</header>
<main>
  <div class="stage" id="stage"></div>
  <div class="pager" id="pager"></div>
  <div class="hint">Лонх дээр дарж мэдээллийг нь харна уу</div>
</main>
<div class="sheet" id="sheet">
  <div class="card" id="card"></div>
</div>
<script src="menu.js"></script>
</body>
</html>
